name: Testing-env-in-github-actions

on:
  workflow_dispatch:
    inputs:
      user_name:
        description: "Enter-Your-Name"
        required: true
        default: "Mayur"

env:
  WORKFLOW_NAME: Workflow-Mayur

jobs:
  Build:
    runs-on: ubuntu-24.04
    env:
      JOB_NAME: Job-Mayur
    steps:
      - name: Testing Env variable
        env:
          STEP_NAME: Step-Mayur
        run: |
          echo "Testing Env"
          echo "${{ env.WORKFLOW_NAME }}"
          echo "${{ env.JOB_NAME }}"
          echo "${{ env.STEP_NAME }}"

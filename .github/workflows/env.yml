name: Testing-env-in-github-actions
on:
  workflow_dispatch:
   inputs:
    description: "Enter-Your-Name" 
    required: true 
    default: "Mayur"
env:
  workflow-name: Workflow-Mayur
jobs:
 Build:
  runs-on: ubuntu-24.04
  env:
   job-name: Job-Mayur
  steps:
   - name: Testing Env variable
     env:
      step-name: Step-Mayur
     run: |
      echo " Testing Env"
      echo "{env.workflow-name}"
      echo "{env.job-name}"
      echo "{env.step-name}"
